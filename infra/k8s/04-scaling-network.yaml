---
# NetworkPolicy for service-to-service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hexideate-network-policy
  namespace: hexideate
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: hexideate
    - podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: hexideate
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# PodDisruptionBudget for Agent Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-service-pdb
  namespace: hexideate
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: agent-service

---
# PodDisruptionBudget for Gateway
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: hexideate
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: gateway
