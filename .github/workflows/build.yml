name: Build and Push Docker Images

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GATEWAY: ghcr.io/${{ github.repository }}/gateway
  IMAGE_NAME_AGENT: ghcr.io/${{ github.repository }}/agent-service
  IMAGE_NAME_VISION: ghcr.io/${{ github.repository }}/vision-service
  IMAGE_NAME_VOICE: ghcr.io/${{ github.repository }}/voice-service
  IMAGE_NAME_ANALYTICS: ghcr.io/${{ github.repository }}/analytics-service
  IMAGE_NAME_NOTIFICATION: ghcr.io/${{ github.repository }}/notification-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_GATEWAY }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}

      - name: Extract metadata for Agent Service
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_AGENT }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Agent Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent_service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}

      - name: Extract metadata for Vision Service
        id: meta-vision
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_VISION }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Vision Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/vision-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-vision.outputs.tags }}
          labels: ${{ steps.meta-vision.outputs.labels }}

      - name: Extract metadata for Voice Service
        id: meta-voice
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_VOICE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Voice Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/voice-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-voice.outputs.tags }}
          labels: ${{ steps.meta-voice.outputs.labels }}

      - name: Extract metadata for Analytics Service
        id: meta-analytics
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_ANALYTICS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Analytics Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-analytics.outputs.tags }}
          labels: ${{ steps.meta-analytics.outputs.labels }}

      - name: Extract metadata for Notification Service
        id: meta-notification
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_NOTIFICATION }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-notification.outputs.tags }}
          labels: ${{ steps.meta-notification.outputs.labels }}
