name: hexideate
description: "HexIdeate - AI-powered medication adherence assistant for elderly Tunisian patients."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_markdown: ^0.7.0

  # HTTP & Networking
  dio: ^5.3.0
  http: ^1.6.0
  connectivity_plus: ^7.1.1
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Data Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication & JWT
  jwt_decoder: ^2.0.1
  
  # Date & Time
  intl: ^0.19.0
  
  # Permission Handling
  permission_handler: ^11.4.0
  
  # Camera & Media
  image_picker: ^1.0.5
  camera: ^0.10.5
  video_player: ^2.8.1
  record: ^5.1.0  # For audio recording
  
  # Local Notifications & Alarms
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  
  # Logging
  logger: ^2.0.1
  
  # Error Tracking (disabled due to Kotlin compatibility - can be re-enabled later)
  # sentry_flutter: ^7.10.0
  
  # Form Validation
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/translations/
dependency_overrides:
  record_linux: 1.2.0
  record_platform_interface: 1.2.0